name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Binary
        run: cargo build --release

      - name: Compress Linux Binary
        run: tar -czf Duetime-x86_64-unknown-linux-gnu.tar.gz -C target/release Duetime

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: Duetime-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binary
        run: cargo build --release

      - name: Install NSIS
        run: winget install Nullsoft.NSIS --accept-source-agreements --accept-package-agreements

      - name: Compile NSIS Installer
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer/install.nsi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: Duetime-Setup.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Duetime-x86_64-unknown-linux-gnu.tar.gz
            Duetime-Setup.exe
          generate-notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
