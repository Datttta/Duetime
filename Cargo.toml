[package]
name = "Duetime"
version = "1.11.2"
edition = "2024"

[dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.189"
log = "0.4.33"
ratatui = "0.30.2"
reqwest = "0.13.5"
rodio = { version = "0.22.2", features = ["minimp3"] }
self_update = { version = "1.3.0", features = ["archive-tar", "archive-zip", "github", "rustls", "compression-tar-gz", "compression-zip-deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
